openapi: 3.0.0
info:
  title: Hey Bible App API
  description: Public API for accessing Bible app data
  version: 1.2.0
servers:
  - url: https://api.heybible.app
    description: Production server
tags:
  - name: HeyBible
    description: Hey Bible App API endpoints for bibles, favorites, notes, images, chats, and tags
paths:
  /bibles:
    get:
      tags:
        - HeyBible
      summary: Get available Bibles
      description: Retrieve Bible translations available to the user
      responses:
        '200':
          description: Bibles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  bibles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique Bible identifier
                        name:
                          type: string
                          description: Full name (e.g. "English Standard Version")
                        abbreviation:
                          type: string
                          description: Short code (e.g. "esv")
                        description:
                          type: string
                        source:
                          type: string
                          enum:
                            - private
                            - api.bible
        '400':
          description: Bad request
        '401':
          description: Unauthorized - invalid or expired API key
        '500':
          description: Internal server error
  /books:
    get:
      tags:
        - HeyBible
      summary: Get Bible books
      description: Retrieve the list of Bible books with their codes and chapter counts
      responses:
        '200':
          description: Books retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  books:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Display name (e.g. "Genesis")
                        code:
                          type: string
                          description: 3-letter code (e.g. "GEN")
                        chapters:
                          type: integer
                          description: Number of chapters in the book
        '400':
          description: Bad request
        '401':
          description: Unauthorized - invalid or expired API key
        '500':
          description: Internal server error
  /images:
    get:
      tags:
        - HeyBible
      summary: Get user's images
      description: Retrieve a list of images with their associated verses, or a specific image if ID is provided
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: Specific image ID to retrieve (returns signed URL)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of images to return (ignored if ID is specified)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of images to skip (ignored if ID is specified)
      responses:
        '200':
          description: Images retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        verse_id:
                          type: integer
                        user_id:
                          type: string
                        storage_path:
                          type: string
                        signed_url:
                          type: string
                          nullable: true
                          description: Pre-signed URL to access the image (24 hour expiry, only returned when requesting by ID)
                        created_at:
                          type: string
                          format: date-time
                        prompt:
                          type: string
                          nullable: true
                        size:
                          type: string
                          nullable: true
        '400':
          description: Bad request
        '401':
          description: Unauthorized - invalid or expired API key
        '404':
          description: Not found - image with specified ID not found
        '500':
          description: Internal server error
    post:
      tags:
        - HeyBible
      operationId: imagesPost
      summary: Generate a verse image
      description: |
        Draw a picture for a verse and save it to the API key owner's account,
        the same way the app does. This spends the account's credits; the cost
        depends on the model. If drawing fails after the credits are taken, they
        are refunded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateImageRequest'
      responses:
        '200':
          description: Image generated and saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateImageResponse'
        '400':
          description: Bad request - for example no verse named, an unknown theme, a custom theme without theme_content, an unknown model, a size the model does not support, or a quote that is too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized - invalid or expired API key
        '402':
          description: Payment required - the account does not have enough credits for this model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not found - verse_id is not one of this account's verses
        '500':
          description: Internal server error
  /notes:
    get:
      tags:
        - HeyBible
      summary: Get notes
      description: Retrieve all notes with their associated verses for the user, or a specific note if ID is provided
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: integer
          description: Specific note ID to retrieve
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of notes to return (ignored if ID is specified)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of notes to skip (ignored if ID is specified)
      responses:
        '200':
          description: Notes retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        verse_id:
                          type: integer
                        content:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
                        last_modified:
                          type: string
                          format: date-time
                          nullable: true
                        user_id:
                          type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized - invalid or expired API key
        '404':
          description: Not found - note with specified ID not found
        '500':
          description: Internal server error
  /search:
    get:
      tags:
        - HeyBible
      summary: Search for verses
      description: Search for Bible verses by book and chapter. Saves the result to the user's account. If start_verse and end_verse are omitted, returns the full chapter.
      parameters:
        - name: book
          in: query
          required: true
          schema:
            type: string
          description: Book name (e.g. "John", "Genesis", "1 Corinthians")
        - name: chapter
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Chapter number
        - name: start_verse
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Starting verse number (defaults to 1)
        - name: end_verse
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Ending verse number (defaults to last verse in chapter)
        - name: bible_id
          in: query
          required: false
          schema:
            type: string
          description: Bible translation ID (defaults to ESV). Use /bibles to get available IDs.
      responses:
        '200':
          description: Verse retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  verse:
                    type: object
                    properties:
                      id:
                        type: integer
                      user_id:
                        type: string
                      bible_id:
                        type: string
                      book:
                        type: string
                      chapter:
                        type: integer
                      start_verse:
                        type: integer
                      end_verse:
                        type: integer
                      content:
                        type: string
                        description: HTML content with superscript verse numbers
                      is_favorite:
                        type: boolean
                      created_at:
                        type: string
                        format: date-time
                      last_updated:
                        type: string
                        format: date-time
        '400':
          description: Bad request - invalid book, chapter, or verse range
        '401':
          description: Unauthorized - invalid or expired API key
        '500':
          description: Internal server error
  /chats:
    get:
      tags:
        - HeyBible
      summary: Get chats
      description: Retrieve the user's chat conversations with verse context. If ID is provided, returns a single chat with its messages.
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Specific chat ID to retrieve (returns full chat with messages)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of chats to return (ignored if ID is specified)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of chats to skip (ignored if ID is specified)
      responses:
        '200':
          description: Chats retrieved successfully
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: List response (no ID specified)
                    properties:
                      chats:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            title:
                              type: string
                              nullable: true
                            model:
                              type: string
                            created_at:
                              type: string
                              format: date-time
                            last_message_at:
                              type: string
                              format: date-time
                            verses:
                              type: object
                              properties:
                                book:
                                  type: string
                                chapter:
                                  type: integer
                                start_verse:
                                  type: integer
                                end_verse:
                                  type: integer
                  - type: object
                    description: Detail response (ID specified)
                    properties:
                      chat:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          title:
                            type: string
                            nullable: true
                          model:
                            type: string
                          created_at:
                            type: string
                            format: date-time
                          last_message_at:
                            type: string
                            format: date-time
                          verses:
                            type: object
                            properties:
                              book:
                                type: string
                              chapter:
                                type: integer
                              start_verse:
                                type: integer
                              end_verse:
                                type: integer
                          chat_messages:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                role:
                                  type: string
                                  enum:
                                    - user
                                    - assistant
                                content:
                                  type: string
                                created_at:
                                  type: string
                                  format: date-time
        '400':
          description: Bad request
        '401':
          description: Unauthorized - invalid or expired API key
        '404':
          description: Not found - chat with specified ID not found
        '500':
          description: Internal server error
  /favorites:
    get:
      tags:
        - HeyBible
      summary: Get favorite verses
      description: Retrieve the user's favorited verses with notes, images, conversations, and tags. Optionally filter by tag name.
      parameters:
        - name: tag
          in: query
          required: false
          schema:
            type: string
          description: Filter favorites by tag name
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          description: Number of favorites to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of favorites to skip
      responses:
        '200':
          description: Favorites retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: string
                        created_at:
                          type: string
                          format: date-time
                        book:
                          type: string
                        chapter:
                          type: integer
                        start_verse:
                          type: integer
                        end_verse:
                          type: integer
                        last_updated:
                          type: string
                          format: date-time
                        content:
                          type: string
                        bible_id:
                          type: string
                        notes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              verse_id:
                                type: integer
                              content:
                                type: string
                              created_at:
                                type: string
                                format: date-time
                                nullable: true
                              last_modified:
                                type: string
                                format: date-time
                                nullable: true
                        images:
                          type: array
                          description: Image metadata (use /images?id= for signed URLs)
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              storage_path:
                                type: string
                              prompt:
                                type: string
                                nullable: true
                              size:
                                type: string
                                nullable: true
                              created_at:
                                type: string
                                format: date-time
                        conversations:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              title:
                                type: string
                                nullable: true
                              model:
                                type: string
                              last_message_at:
                                type: string
                                format: date-time
                        tags:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              color:
                                type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized - invalid or expired API key
        '500':
          description: Internal server error
  /tags:
    get:
      tags:
        - HeyBible
      summary: Get tags
      description: Retrieve all tags defined by the user
      responses:
        '200':
          description: Tags retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        color:
                          type: string
                        created_at:
                          type: string
                          format: date-time
        '400':
          description: Bad request
        '401':
          description: Unauthorized - invalid or expired API key
        '500':
          description: Internal server error
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Hey-Bible-Api-Key
  schemas:
    GenerateImageRequest:
      type: object
      description: |
        Name the verse with verse_id, or with book and chapter (plus optional
        start_verse, end_verse and bible_id). One of the two is required.
      properties:
        verse_id:
          type: integer
          description: ID of a verse already saved to this account. When set, the book, chapter, verse and bible fields are ignored.
        book:
          type: string
          description: Book name (e.g. "Isaiah", "1 Corinthians"). Required with chapter when verse_id is not set.
        chapter:
          type: integer
          minimum: 1
          description: Chapter number. Required with book when verse_id is not set.
        start_verse:
          type: integer
          minimum: 1
          description: First verse of the passage
        end_verse:
          type: integer
          minimum: 1
          description: Last verse of the passage. Defaults to start_verse, so one verse is drawn when only start_verse is set.
        bible_id:
          type: string
          description: Bible translation ID. Use GET /bibles to list them. Defaults to the API's default translation.
        theme:
          type: string
          enum:
            - hey_bible
            - animals
            - celestial
            - custom
            - fantasy
            - flowers
            - landscape
            - literal
            - medieval
            - minimalist
            - stained_glass
            - watercolor
          default: hey_bible
          description: Picture style. custom draws the prompt in theme_content.
        theme_content:
          type: string
          description: The picture to draw. Required when theme is custom.
        size:
          type: string
          enum:
            - portrait
            - square
            - landscape
          default: square
          description: Image shape. portrait is 9:16, square is 1:1 and landscape is 16:9.
        model:
          type: string
          description: Image model ID (e.g. "flux-2-pro"). Defaults to the app's default model. Models cost different numbers of credits.
        quote:
          type: string
          description: Text printed on the picture. Defaults to the verse text. At most 40 words for square and 70 words for portrait or landscape.
        source:
          type: string
          description: Citation printed under the quote. Defaults to the verse reference.
        copyright:
          type: string
          description: Copyright line for the picture. Ignored when the translation has its own copyright line.
    GeneratedImage:
      type: object
      properties:
        id:
          type: integer
        verse_id:
          type: integer
        storage_path:
          type: string
        signed_url:
          type: string
          nullable: true
          description: Link to the image, valid for 24 hours. Null when the link could not be signed; fetch the image with GET /images?id= instead of generating it again.
        signed_url_error:
          type: string
          description: Set only when signed_url is null. Explains how to fetch the image that was created.
        prompt:
          type: string
          nullable: true
        size:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        quote:
          type: string
        source:
          type: string
        copyright:
          type: string
          nullable: true
        fums_token:
          type: string
          nullable: true
          description: API.Bible usage token for licensed translations
    GenerateImageResponse:
      type: object
      properties:
        image:
          $ref: '#/components/schemas/GeneratedImage'
        credits_charged:
          type: integer
          description: Credits taken from the account for this image
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: What went wrong
security:
  - ApiKeyAuth: []
